spring.application.name=stat-ai
server.port=${PORT:8080}
server.address=0.0.0.0
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:sih_learning_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
spring.ai.openai.api-key=${OPENAI_API_KEY:mock-openai-key-for-development}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=${OPENAI_TEMPERATURE:0.3}
spring.ai.openai.chat.options.max-tokens=${OPENAI_MAX_TOKENS:1000}
app.auth.enabled=${AUTH_ENABLED:false}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:}
logging.level.com.sih.learningplatform=${APP_LOG_LEVEL:INFO}
