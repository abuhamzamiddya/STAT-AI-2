services:
  - type: web
    name: stat-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "10000"
      - key: AUTH_ENABLED
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
